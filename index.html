<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WellTrack - Daily Wellness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🌱 WellTrack</h1>
        <p>Track your daily wellness & build healthy habits</p>
    </header>

    <main>
        <section class="tracker">
            <h2>Today's Wellness</h2>

            <label>Mood (1–5)</label>
            <input type="number" id="mood" min="1" max="5">

            <label>Sleep (hours)</label>
            <input type="number" id="sleep">

            <label>Water Intake (glasses)</label>
            <input type="number" id="water">

            <label>Exercise (minutes)</label>
            <input type="number" id="exercise">

            <label>
                <input type="checkbox" id="habit">
                Completed Personal Habit
            </label>

            <button onclick="saveData()">Save Today</button>
        </section>

        <section class="summary">
            <h2>📊 Daily Summary</h2>
            <div id="output">No data yet</div>
        </section>
    </main>

    <footer>
        <p>© 2026 WellTrack | Stay Healthy 💚</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
